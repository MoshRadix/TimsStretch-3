[package]
name = "mosh-timestretch-3"
version = "1.0.0"
description = "M0SH TimeStretch 3 — Desktop Audio Workstation, Time-Stretch & Pitch-Shift Player, Live WAV Recorder, and Bilingual English/Dhivehi (Thaana) Transcription Studio"
authors = ["M0sh <https://github.com/MoshRadix>"]
edition = "2021"

[lib]
name = "mosh_timestretch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "macros", "time"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = "s"

[profile.release.package.symphonia]
opt-level = 3

[profile.release.package.symphonia-bundle-mp3]
opt-level = 3

[profile.release.package.symphonia-core]
opt-level = 3
