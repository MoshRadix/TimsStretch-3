name: Release TimeStretch 3

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure GitHub Release Exists for Tag
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Checking release ${TAG}..."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" \
              --title "M0SH TimeStretch 3 ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              --target "${GITHUB_SHA}"
          fi

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Windows Authenticode Signing (M0sh.pfx & sign.cmd)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64.Trim())
            $pfxPath = Join-Path $PWD "src-tauri\M0sh.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

            $signCmdContent = @(
              '@echo off',
              'setlocal',
              'set "PFX_PATH=%~dp0M0sh.pfx"',
              "set `"PFX_PASS=$($env:PFX_PASS)`"",
              'set "SIGNTOOL=signtool.exe"',
              'for /f "delims=" %%F in (''dir /b /s "C:\Program Files (x86)\Windows Kits\10\bin\*signtool.exe" 2^>nul ^| findstr /i "\\x64\\signtool.exe"'') do set "SIGNTOOL=%%F"',
              '"%SIGNTOOL%" sign /f "%PFX_PATH%" /p "%PFX_PASS%" /fd sha256 "%~1"',
              'exit /b %ERRORLEVEL%'
            ) -join "`r`n"
            Set-Content -Path (Join-Path $PWD "src-tauri\sign.cmd") -Value $signCmdContent -Encoding ASCII
            Write-Host "Restored src-tauri/M0sh.pfx and src-tauri/sign.cmd for Authenticode signing."
          } else {
            Write-Warning "WINDOWS_PFX_BASE64 secret not set; skipping Windows Authenticode signing."
          }

      - name: Build and Publish Tauri Bundles + Updater Manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "M0SH TimeStretch 3 v__VERSION__"
          releaseBody: "Automated multi-platform release of M0SH TimeStretch 3 desktop audio workstation."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
